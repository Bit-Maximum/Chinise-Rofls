services:

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"   # WEB UI
      - "443:443"
    environment:
      TZ: "Asia/Vladivostok"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
