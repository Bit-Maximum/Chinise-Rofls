services:
  db:
    image: postgres:17-alpine
    container_name: confluence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: confluence
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: confluence
    volumes:
      - db_data:/var/lib/postgresql/data

  confluence:
    image: atlassian/confluence:10.2.6-ubi9
    container_name: confluence
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8888:8090"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://db:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: confluence
      ATL_DB_TYPE: postgresql

      ATL_PROXY_NAME: confluence.kiberorange.ru
      ATL_PROXY_PORT: 443
      ATL_TOMCAT_SCHEME: https
      ATL_TOMCAT_SECURE: "true"
    volumes:
      - confluence_data:/var/atlassian/application-data/confluence

volumes:
  db_data:
  confluence_data:
