      EMAIL_SMTP_AUTH: false
      EMAIL_USE_TLS: false
      EMAIL_SITE_URL: http://localhost:9006

      SYSTEM_USER_USERNAME: system
      SYSTEM_USER_PASSWORD: 12345678
    depends_on:
      - orng-employee
      - database
      - redis
      - rabbitmq
      - mailcatcher
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
