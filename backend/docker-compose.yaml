    container_name: ${NOTIFICATION_HOST:-orng-notification}
    hostname: ${NOTIFICATION_HOST:-orng-notification}
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-8086}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:${PG_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_notification
      DB_USER: orng
      DB_PASS: orng
      SERVER_PORT: 8080

      ACCESS_TOKEN_EXIRATION_SECONDS: 899999999
      REFRESH_TOKEN_EXIRATION_SECONDS: 604800

      JWT-ISSUER: orng-auth
      JWT-DEFAULT-USER-SCOPES: ROLE_MANAGER
      LOGGING_LEVEL_DEFAULT: INFO

      OLTP_URL: http://jaeger:4317
      AUTH_SERVICE_URL: orng-auth:8080
      EMPLOYEE_SERVICE_URL: orng-employee:8080
      SCHEDULE_SERVICE_URL: orng-schedule:8080
      OFFICE_SERVICE_URL: orng-office:8080
      APPLICATION_SERVICE_URL: orng-application:8080
      CATALOG_SERVICE_URL: orng-catalog:8080
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orng}

      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_DEFAULT_VHOST: orng
      RABBIT_USERNAME: orng
      RABBIT_PASSWORD: orng

      SCHEDULE_UPDATED_DELAY_SECONDS: 60

      EMAIL_HOST: mailcatcher
      EMAIL_PORT: 1025
      EMAIL_USERNAME: admin@admin.com
      EMAIL_SMTP_AUTH: false
      EMAIL_USE_TLS: false
      EMAIL_SITE_URL: http://localhost:9006

      SYSTEM_USER_USERNAME: system
      SYSTEM_USER_PASSWORD: 12345678
    depends_on:
      - database
      - redis
      - rabbitmq
      - mailcatcher

  database:
    image: 'postgres:18-alpine'
    container_name: ${DB_HOST:-database}
    hostname: ${DB_HOST:-database}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-orng}
      POSTGRES_PASSWORD: ${DB_PASS:-orng}
      POSTGRES_DB: ${DB_NAME:-orng}
    volumes:
      - db:/var/lib/postgresql/data postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${DB_NAME:-orng}", "-U", "${DB_USER:-orng}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-seed:
    image: postgres:18-alpine
    container_name: db-seed
    depends_on:
      orng-office:
        condition: service_healthy
    volumes:
      - ./init.sql:/seed/init.sql:ro
    environment:
      PGPASSWORD: ${DB_PASS:-orng}
    command: >
      sh -lc "
        echo 'Seeding demo data...';
        psql -h database -U ${DB_USER:-orng} -d ${DB_NAME:-orng} -v ON_ERROR_STOP=1 -f /seed/init.sql;
        echo 'Seed done.'
      "
    restart: no

  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-enterprise:12.3.3
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=true
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  redis:
    image: redis:8.4-alpine
    container_name: ${REDIS_HOST:-redis}
    hostname: ${REDIS_HOST:-redis}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orng}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-orng}
      --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orng}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.2-alpine
    container_name: ${RABBITMQ_HOST:-rabbitmq}
    hostname: ${RABBITMQ_HOST:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-orng}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orng}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-orng}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,error}] disk_free_limit 20000000
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"

  mailcatcher:
    container_name: mailcatcher
    hostname: mailcatcher
    restart: on-failure:10
    image: sj26/mailcatcher:latest
    environment:
      - MAIL_LIMIT=1000
      - TIMEZONE=Europe/Moscow
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  db:
  grafana-storage:
  redis-data:
  rabbit-data:
