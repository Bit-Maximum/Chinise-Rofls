      SCHEDULE_SERVICE_URL: orng-schedule:8080
      OFFICE_SERVICE_URL: orng-office:8080
      APPLICATION_SERVICE_URL: orng-application:8080
      CATALOG_SERVICE_URL: orng-catalog:8080
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orng}

      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_DEFAULT_VHOST: orng
      RABBIT_USERNAME: orng
      RABBIT_PASSWORD: orng

      SCHEDULE_UPDATED_DELAY_SECONDS: 60

      EMAIL_HOST: mailcatcher
