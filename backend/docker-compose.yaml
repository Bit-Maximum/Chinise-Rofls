services:

  orng-auth:
    image: bitmaximum/orng-auth:latest
    container_name: orng-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:${PG_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_auth
      DB_USER: orng
      DB_PASS: orng
      SERVER_PORT: 8080

      ACCESS_TOKEN_EXIRATION_SECONDS: 899999999
      REFRESH_TOKEN_EXIRATION_SECONDS: 604800

      JWT-ISSUER: orng-auth
      JWT-DEFAULT-USER-SCOPES: ROLE_MANAGER
      LOGGING_LEVEL_DEFAULT: TRACE

      EMPLOYEE_SERVICE_URL: employee-service:8080
      SCHEDULE_SERVICE_URL: schedule-service:8080
      OFFICE_SERVICE_URL: orng-office:8080
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006
    depends_on:
      - database

  orng-office:
    image: bitmaximum/orng-office:latest
    container_name: orng-office
    restart: unless-stopped
    ports:
      - "${OFFICE_PORT:-8081}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:${PG_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_office
      DB_USER: ${DB_USER:-orng}
      DB_PASS: ${DB_PASS:-orng}
      JWT-ISSUER: orng-auth
      SERVER_PORT: 8080

      LOGGING_LEVEL_DEFAULT: TRACE
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006
      JWT_PUBLIC_KEY: 
      EMPLOYEE_SERVICE_URL: employee-service:8080
      SCHEDULE_SERVICE_URL: schedule-service:8080
      OFFICE_SERVICE_URL: orng-office:8080
    depends_on:
      - database

  employee-service:
    image: rumarsky/orng-employee:latest
    container_name: employee-service
    ports:
      - "${EM_PORT:-8082}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:${PG_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_employee
      DB_USER: ${DB_USER:-orng}
      DB_PASS: ${DB_PASS:-orng}
      SERVER_PORT: 8080

      EMPLOYEE_SERVICE_URL: employee-service:8080
      SCHEDULE_SERVICE_URL: schedule-service:8080
      OFFICE_SERVICE_URL: orng-office:8080

      JWT-ISSUER: orng-auth
      LOGGING_LEVEL_DEFAULT: TRACE
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006
      JWT_PUBLIC_KEY: 

    depends_on:
      - database
    restart: unless-stopped

  schedule-service:
    image: rumarsky/orng-schedule:latest
    container_name: schedule-service
    ports:
      - "${SS_PORT:-8083}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:${PG_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_schedule
      DB_USER: ${DB_USER:-orng}
      DB_PASS: ${DB_PASS:-orng}
      SERVER_PORT: 8080

      EMPLOYEE_SERVICE_URL: employee-service:8080
      SCHEDULE_SERVICE_URL: schedule-service:8080
      OFFICE_SERVICE_URL: orng-office:8080

      JWT-ISSUER: orng-auth
      LOGGING_LEVEL_DEFAULT: TRACE
      CORS_ALLOWED_ORIGINS: https://kiberorange.ru,http://kiberorange.ru,https://front.kiberorange.ru,http://www.kiberorange.ru,http://localhost:9006,http://127.0.0.1:9006
      JWT_PUBLIC_KEY: 
    depends_on:
      - database
      - employee-service
    restart: unless-stopped

  orng-catalog:
    image: bitmaximum/orng-catalog:latest
    container_name: ${CATALOG_HOST:-orng-catalog}
    hostname: ${CATALOG_HOST:-orng-catalog}
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-8084}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://${DB_HOST:-database}:${DB_PORT:-5432}/${DB_NAME:-orng}?currentSchema=orng_catalog}
      DB_USER: ${DB_USER:-orng}
      DB_PASS: ${DB_PASS:-orng}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT-ISSUER: ${JWT-ISSUER:-orng-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      LOGGING_LEVEL_DEFAULT: ${LOGGING_LEVEL_DEFAULT:-INFO}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orng}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: 'postgres:18-alpine'
    container_name: ${DB_HOST:-database}
    hostname: ${DB_HOST:-database}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-orng}
      POSTGRES_PASSWORD: ${DB_PASS:-orng}
      POSTGRES_DB: ${DB_NAME:-orng}
    volumes:
      - db:/var/lib/postgresql/data postgres
      - type: bind
        source: ./init.sql
        target: /docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${DB_NAME:-orng}", "-U", "${DB_USER:-orng}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.4-alpine
    container_name: ${REDIS_HOST:-redis}
    hostname: ${REDIS_HOST:-redis}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orng}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-orng}
      --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orng}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

volumes:
  db:
  redis-data:
